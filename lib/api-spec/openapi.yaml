      summary: Update a labor rate
      parameters:
        - $ref: "#/components/parameters/LaborRateId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LaborRateUpdate"
      responses:
        "200":
          description: Updated labor rate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LaborRate"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteLaborRate
      tags: [estimates]
      summary: Delete a labor rate
      parameters:
        - $ref: "#/components/parameters/LaborRateId"
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"


  /purchase-orders/{poId}/receiving:
    get:
      operationId: listPoReceivingRecords
      tags: [inventory]
      summary: List receiving records for a purchase order
      parameters:
        - $ref: "#/components/parameters/PoId"
      responses:
        "200":
          description: Receiving records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReceivingRecord"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createReceivingRecord
      tags: [inventory]
      summary: Record a receiving event against a purchase order
      description: >
        Captures one delivery. Every line requires a heat/lot number and a
        CMTR document reference at receiving time — they cannot be filled in
        later. Each received line creates an available inventory item
        allocated to the PO's job and logs a costed material movement.
      parameters:
        - $ref: "#/components/parameters/PoId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceivingRecordInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceivingRecord"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /inventory:
    get:
      operationId: listInventoryItems
      tags: [inventory]
      summary: List inventory items (stock and remnants)
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/InventoryStatus"
        - name: search
          in: query
          schema:
            type: string
        - name: jobId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Inventory items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryItem"
    post:
      operationId: createInventoryItem
      tags: [inventory]
      summary: Add an inventory item manually (general stock without a receiving record)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryItemInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /inventory/{itemId}/consume:
    post:
      operationId: consumeInventoryItem
      tags: [inventory]
      summary: Consume inventory on a job
      description: >
        Consumes pieces from an available inventory item against a job
        (optionally a specific BOM part). Cross-job consumption is allowed and
        preserves the original heat/vendor/PO/CMTR traceability chain. A
        remnant can be cut back into stock in the same operation; it carries
        the original receiving-line reference forward.
      parameters:
        - $ref: "#/components/parameters/ItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryConsumeInput"
      responses:
        "200":
          description: Updated inventory item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Item is not available or has insufficient quantity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /inventory/{itemId}/transfer:
    post:
      operationId: transferInventoryItem
      tags: [inventory]
      summary: Transfer an inventory item between jobs or to general stock
      parameters:
        - $ref: "#/components/parameters/ItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryTransferInput"
      responses:
        "200":
          description: Updated inventory item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Item cannot be transferred in its current status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /inventory/{itemId}/commit:
    post:
      operationId: commitInventoryItem
      tags: [inventory]
      summary: Commit an inventory item to a job (reserve it so other jobs can't plan it)
      parameters:
        - $ref: "#/components/parameters/ItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryCommitInput"
      responses:
        "200":
          description: Updated inventory item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Item is already consumed or committed to another job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /inventory/{itemId}/uncommit:
    post:
      operationId: uncommitInventoryItem
      tags: [inventory]
      summary: Release a commitment, returning the item to available status
      parameters:
        - $ref: "#/components/parameters/ItemId"
      responses:
        "200":
          description: Updated inventory item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Item is not committed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /jobs/{jobId}/heat-sheet:
    get:
      operationId: getJobHeatSheet
      tags: [inventory]
      summary: Job Heat Sheet — relational traceability per consumption
      description: >
        Assembly → part → inventory item → receiving line → CMTR/PO/vendor for
        every consumption charged to the job, including remnants originally
        received against other jobs (original references carried forward).
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Heat sheet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobHeatSheet"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /jobs/{jobId}/stock-matches:
    get:
      operationId: getJobStockMatches
      tags: [inventory]
      summary: On-hand stock matching the job's BOM material needs
      description: >
        For each material rolled up from the job's BOM, lists matching
        available inventory so buyers can use stock before creating a new PO.
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Stock matches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StockMatch"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /reports/material-movements:
    get:
      operationId: getMaterialMovementsReport
      tags: [inventory]
      summary: Monthly material-movement report (cost per job)
      description: >
        All material movements in the given month with cost, plus per-job
        totals — the export that replaces manual ComputerEase reconstruction.
      parameters:
        - name: month
          in: query
          required: true
          description: Calendar month, YYYY-MM
          schema:
            type: string
            pattern: '^\d{4}-\d{2}$'
      responses:
        "200":
          description: Material movements for the month
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialMovementsReport"
        "400":
          description: Invalid month
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /reports/inventory-trend:
    get:
      operationId: getInventoryTrendReport
      tags: [inventory]
      summary: Inventory cost/usage trend by month
      parameters:
        - name: months
          in: query
          description: Number of trailing months (default 12)
          schema:
            type: integer
      responses:
        "200":
          description: Trend points, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryTrendPoint"

  /ncrs:
    get:
      operationId: listNcrs
      tags: [qc]
      summary: List nonconformance reports
      parameters:
        - name: jobId
          in: query
          required: false
          schema:
            type: integer
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [open, closed]
      responses:
        "200":
          description: NCRs, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ncr"
    post:
      operationId: createNcr
      tags: [qc]
      summary: Create a nonconformance report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NcrInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ncr"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /ncrs/{ncrId}:
    patch:
      operationId: updateNcr
      tags: [qc]
      summary: Update an NCR (disposition, root cause, approval, closure)
      description: >
        Closing an NCR requires a disposition. Approval stamps the caller
        as approver.
      parameters:
        - name: ncrId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NcrUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ncr"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /substitution-requests:
    get:
      operationId: listSubstitutionRequests
      tags: [qc]
      summary: List material substitution requests
      parameters:
        - name: jobId
          in: query
          required: false
          schema:
            type: integer
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, approved, rejected]
      responses:
        "200":
          description: Substitution requests, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SubstitutionRequest"
    post:
      operationId: createSubstitutionRequest
      tags: [qc]
      summary: Create a substitution request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubstitutionRequestInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubstitutionRequest"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /substitution-requests/{requestId}:
    patch:
      operationId: updateSubstitutionRequest
      tags: [qc]
      summary: Update / approve / reject a substitution request
      description: >
        Approval is blocked for customer-specified or safety-critical
        substitutions until customer concurrence is recorded.
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubstitutionRequestUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubstitutionRequest"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Gate violation (customer concurrence required)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /jobs/{jobId}/shipments:
    get:
      operationId: listJobShipments
      tags: [shipping]
      summary: List shipments for a job
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Shipments, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Shipment"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createShipment
      tags: [shipping]
      summary: Create a shipment from Ready-to-Ship assemblies
      description: >
        Every assembly must be Ready to Ship (current stage Inspected and not
        on hold) and not already on another open shipment. Shipper number is
        assigned as [job#]-S[NN].
      parameters:
        - $ref: "#/components/parameters/JobId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShipmentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shipment"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: An assembly is not Ready to Ship
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /shipments/{shipmentId}:
    get:
      operationId: getShipment
      tags: [shipping]
      summary: Get a shipment
      parameters:
        - $ref: "#/components/parameters/ShipmentId"
      responses:
        "200":
          description: Shipment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shipment"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteShipment
      tags: [shipping]
      summary: Delete a planned (not departed) shipment
      parameters:
        - $ref: "#/components/parameters/ShipmentId"
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Departed shipments cannot be deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /shipments/{shipmentId}/notification:
    post:
      operationId: createShipmentNotification
      tags: [shipping]
      summary: Record the written shipment notification
      description: >
        Required before BOL/packing-slip paperwork can be generated. One
        notification per shipment.
      parameters:
        - $ref: "#/components/parameters/ShipmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShipmentNotificationInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shipment"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Notification already recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /shipments/{shipmentId}/load-confirmation:
    post:
      operationId: createLoadConfirmation
      tags: [shipping]
      summary: Record the signed load confirmation
      description: Required before a shipment can be marked departed.
      parameters:
        - $ref: "#/components/parameters/ShipmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoadConfirmationInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shipment"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Load confirmation already recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /shipments/{shipmentId}/depart:
    post:
      operationId: departShipment
      tags: [shipping]
      summary: Mark a shipment departed
      description: >
        Hard gate — requires a signed load confirmation. Moves every assembly
        on the shipment to the Shipped stage.
      parameters:
        - $ref: "#/components/parameters/ShipmentId"
      responses:
        "200":
          description: Departed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shipment"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Gate violation (no signed load confirmation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  parameters:
    DrawingId:
      name: drawingId
      in: path
      required: true
      schema:
        type: integer
    RevisionId:
      name: revisionId
      in: path
      required: true
      schema:
        type: integer
    RfiId:
      name: rfiId
      in: path
      required: true
      schema:
        type: integer
    EcnId:
      name: ecnId
      in: path
      required: true
      schema:
        type: integer
    PoId:
      name: poId
      in: path
      required: true
      schema:
        type: integer
    ShipmentId:
      name: shipmentId
      in: path
      required: true
      schema:
        type: integer
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: integer
    AssemblyId:
      name: assemblyId
      in: path
      required: true
      schema:
        type: integer
    PartId:
      name: partId
      in: path
      required: true
      schema:
        type: integer
    StageId:
      name: stageId
      in: path
      required: true
      schema:
        type: integer
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: integer
    EmployeeId:
      name: employeeId
      in: path
      required: true
      schema:
        type: integer
    EntryId:
      name: entryId
      in: path
      required: true
      schema:
        type: integer
    VendorId:
      name: vendorId
      in: path
      required: true
      schema:
        type: integer
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: integer
    ClauseId:
      name: clauseId
      in: path
      required: true
      schema:
        type: integer
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: integer
    EstimateId:
      name: estimateId
      in: path
      required: true
      schema:
        type: integer
    CustomerId:
      name: customerId
      in: path
      required: true
      schema:
        type: integer
    ContactId:
      name: contactId
      in: path
      required: true
      schema:
        type: integer
    AddressId:
      name: addressId
      in: path
      required: true
      schema:
        type: integer
    EstimateBomAssemblyId:
      name: assemblyId
      in: path
      required: true
      schema:
        type: integer
    EstimateBomPartId:
      name: partId
      in: path
      required: true
      schema:
        type: integer
    EstimateLaborLineId:
      name: lineId
      in: path
      required: true
      schema:
        type: integer
    LaborRateId:
      name: rateId
      in: path
      required: true
      schema:
        type: integer
  schemas:
    Ncr:
      type: object
      required:
        - id
        - number
        - source
        - description
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
        number:
          type: string
        source:
          type: string
          enum: [receiving, in_process, final, post_delivery]
        description:
          type: string
        jobId:
          type: ["integer", "null"]
        jobNumber:
          type: ["string", "null"]
        assemblyId:
          type: ["integer", "null"]
        assemblyMark:
          type: ["string", "null"]
        purchaseOrderId:
          type: ["integer", "null"]
        poNumber:
          type: ["string", "null"]
        disposition:
          type: ["string", "null"]
          enum: [rework, scrap, accept_with_deviation, null]
        dispositionNotes:
          type: ["string", "null"]
        rootCause:
          type: ["string", "null"]
        approvedBy:
          type: ["integer", "null"]
        approvedByName:
          type: ["string", "null"]
        approvedAt:
          type: ["string", "null"]
        status:
          type: string
          enum: [open, closed]
        closedAt:
          type: ["string", "null"]
        createdByName:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string

    NcrInput:
      type: object
      required: [source, description]
      properties:
        source:
          type: string
          enum: [receiving, in_process, final, post_delivery]
        description:
          type: string
          minLength: 1
        jobId:
          type: ["integer", "null"]
        assemblyId:
          type: ["integer", "null"]
        purchaseOrderId:
          type: ["integer", "null"]

    NcrUpdate:
      type: object
      properties:
        description:
          type: string
        disposition:
          type: ["string", "null"]
          enum: [rework, scrap, accept_with_deviation, null]
        dispositionNotes:
          type: ["string", "null"]
        rootCause:
          type: ["string", "null"]
        approve:
          type: boolean
          description: Stamp the caller as approver
        close:
          type: boolean
          description: Close the NCR (requires a disposition)
        reopen:
          type: boolean

    SubstitutionRequest:
      type: object
      required:
        - id
        - number
        - originalSpec
        - proposedSubstitution
        - type
        - engineeringRationale
        - customerSpecified
        - safetyCritical
        - customerConcurrence
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
        number:
          type: string
        jobId:
          type: ["integer", "null"]
        jobNumber:
          type: ["string", "null"]
        assemblyId:
          type: ["integer", "null"]
        assemblyMark:
          type: ["string", "null"]
        originalSpec:
          type: string
        proposedSubstitution:
          type: string
        type:
