openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Steel Fabrication MRP API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: nesting
    description: 1D cutting-stock nesting and cut-list generation
  - name: jobs
    description: Job and production tracking operations
  - name: estimates
    description: Pre-production estimates (bids) and conversion to jobs
  - name: stages
    description: Job stage and routing operations
  - name: stage-library
    description: Configurable library of available production stages
  - name: employees
    description: Employee records for time tracking
  - name: time
    description: Clock in/out and time entry operations
  - name: dashboard
    description: Aggregated production dashboard views
  - name: documents
    description: Job document attachments
  - name: bom
    description: KISS bill-of-materials import and views
  - name: customers
    description: CRM customer, contact, and address operations
  - name: purchase-orders
    description: Materials purchase orders and PM review
  - name: qc
    description: Nonconformance reports and material substitution requests
  - name: shipping
    description: Shipments, ship notifications, load confirmations, and paperwork gates
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /estimates:
    get:
      operationId: listEstimates
      tags: [estimates]
      summary: List estimates
      description: List all estimates, optionally filtered by status or search term.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [draft, submitted, won, lost]
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: A list of estimates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Estimate"
    post:
      operationId: createEstimate
      tags: [estimates]
      summary: Create an estimate
      description: Create an estimate. The bid number is auto-assigned by the server.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EstimateInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Estimate"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /estimates/{estimateId}:
    get:
      operationId: getEstimate
      tags: [estimates]
      summary: Get an estimate
      parameters:
        - $ref: "#/components/parameters/EstimateId"
      responses:
        "200":
          description: Estimate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Estimate"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateEstimate
      tags: [estimates]
      summary: Update an estimate
      description: Update estimate fields or status (e.g. mark Lost). Won status is set via the convert endpoint.
      parameters:
        - $ref: "#/components/parameters/EstimateId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EstimateUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Estimate"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteEstimate
      tags: [estimates]
      summary: Delete an estimate
      description: Delete an estimate. Converted (won) estimates cannot be deleted.
      parameters:
        - $ref: "#/components/parameters/EstimateId"
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Cannot delete a converted estimate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /estimates/{estimateId}/convert:
    post:
      operationId: convertEstimateToJob
      tags: [estimates]
      summary: Mark estimate Won and convert it to a job
      description: >-
        Marks the estimate Won and creates a job linked to it with an
        auto-assigned job number and the given (or default) stage routing.
      parameters:
        - $ref: "#/components/parameters/EstimateId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EstimateConvertInput"
      responses:
        "201":
          description: Created job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Estimate already converted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: List jobs
      description: List all jobs, optionally filtered by status.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, on_hold, complete, closed]
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: A list of jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"
    post:
      operationId: createJob
      tags: [jobs]
      summary: Create a job
      description: Create a job with an optional custom stage routing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobDetail"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /jobs/{jobId}:
    get:
      operationId: getJob
      tags: [jobs]
      summary: Get a job with full detail
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Job detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateJob
      tags: [jobs]
      summary: Update a job
      parameters:
        - $ref: "#/components/parameters/JobId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteJob
      tags: [jobs]
      summary: Delete a job
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /jobs/{jobId}/advance:
    post:
      operationId: advanceJobStage
      tags: [jobs]
      summary: Advance job to the next stage
      description: Marks the current in-progress stage complete and starts the next stage.
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Updated job detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /jobs/{jobId}/stages:
    post:
      operationId: addJobStage
      tags: [stages]
      summary: Add a stage to a job
      parameters:
        - $ref: "#/components/parameters/JobId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StageInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /jobs/{jobId}/stages/reorder:
    post:
      operationId: reorderJobStages
      tags: [stages]
      summary: Reorder a job's stages
      description: >
        Accepts the full ordered list of the job's stage IDs. Only
        not-started stages may change position; completed and in-progress
        stages must remain at their current positions.
      parameters:
        - $ref: "#/components/parameters/JobId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderStagesBody"
      responses:
        "200":
          description: Updated job detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobDetail"
        "400":
          description: Invalid stage order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Reorder would move a locked (completed or in-progress) stage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /jobs/{jobId}/documents:
    get:
      operationId: listJobDocuments
      tags: [documents]
      summary: List documents attached to a job
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Document"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: uploadJobDocument
      tags: [documents]
      summary: Upload a document to a job
      description: >
        Multipart upload. Fields: `file` (binary) and `category`
        (drawing, mtr, photo, nc_data, spreadsheet, other).
        Allowed file types: PDF, DWG, DXF, NC-1/DSTV (.nc1, .nc), JPG, PNG, XLSX, CSV.
      parameters:
        - $ref: "#/components/parameters/JobId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/DocumentUploadForm"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "400":
          description: Invalid input (disallowed file type or too large)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /estimates/{estimateId}/documents:
    get:
      operationId: listEstimateDocuments
      tags: [documents]
      summary: List documents attached to an estimate
      parameters:
        - $ref: "#/components/parameters/EstimateId"
      responses:
        "200":
          description: Documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Document"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: uploadEstimateDocument
      tags: [documents]
      summary: Upload a document to an estimate
      description: >
        Multipart upload. Fields: `file` (binary) and `category`
        (drawing, mtr, photo, nc_data, spreadsheet, other).
        Allowed file types: PDF, DWG, DXF, NC-1/DSTV (.nc1, .nc), JPG, PNG, XLSX, CSV.
      parameters:
        - $ref: "#/components/parameters/EstimateId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/DocumentUploadForm"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "400":
          description: Invalid input (disallowed file type or too large)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /documents/{documentId}:
    delete:
      operationId: deleteDocument
      tags: [documents]
      summary: Delete a document
      description: Removes the document record and its stored file.
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /documents/{documentId}/download:
    get:
      operationId: downloadDocument
      tags: [documents]
      summary: Download a document file
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: File contents
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /bom/assemblies/{assemblyId}:
    patch:
      operationId: updateBomAssembly
      tags: [bom]
      summary: Update tracking fields of a BOM assembly
      description: >-
        Edits an assembly's description, quantity, processing path, current
        stage, hold flag, and notes. The mark (BOM identity key) cannot change.
      parameters:
        - $ref: "#/components/parameters/AssemblyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BomAssemblyUpdate"
      responses:
        "200":
          description: Updated assembly
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BomAssembly"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /bom/parts/{partId}:
    patch:
      operationId: updateBomPart
      tags: [bom]
      summary: Update a BOM part row
      description: >-
        Edits a part's piece marks, quantity, profile fields, and heat number
        for heat traceability.
      parameters:
        - $ref: "#/components/parameters/PartId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BomPartUpdate"
      responses:
        "200":
          description: Updated part
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BomPart"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /bom/parts/{partId}/documents:
    get:
      operationId: listPartDocuments
      tags: [documents]
      summary: List documents attached to a BOM part
      parameters:
        - $ref: "#/components/parameters/PartId"
      responses:
        "200":
          description: Documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Document"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: uploadPartDocument
      tags: [documents]
      summary: Upload a PDF to a BOM part
      description: >
        Multipart upload of a mill test report or similar certificate for a
        specific part line. Field: `file` (binary). PDF files only.
        The document is stored with category `mtr`.
      parameters:
        - $ref: "#/components/parameters/PartId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/PartDocumentUploadForm"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "400":
          description: Invalid input (not a PDF or too large)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /bom/parse:
    post:
      operationId: parseBomFile
      tags: [bom]
      summary: Parse a KISS file for preview
      description: >
        Parses a KISS (.kss) bill-of-materials file and returns the parsed
        assemblies, parts, and material totals without saving anything.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/BomUploadForm"
      responses:
        "200":
          description: Parsed BOM preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BomView"
        "400":
          description: Invalid or malformed KISS file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /jobs/{jobId}/bom:
    get:
      operationId: getJobBom
      tags: [bom]
      summary: Get a job's bill of materials
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: The job's BOM (empty assemblies list when no BOM imported)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BomView"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: uploadJobBom
      tags: [bom]
      summary: Import a KISS file as the job's bill of materials
      description: >
        Parses the uploaded KISS (.kss) file and replaces the job's stored
        BOM. The original file is also attached to the job's documents.
      parameters:
        - $ref: "#/components/parameters/JobId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/BomUploadForm"
      responses:
        "201":
          description: Imported BOM
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BomView"
        "400":
          description: Invalid or malformed KISS file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /stages/{stageId}:
    patch:
      operationId: updateStage
      tags: [stages]
      summary: Update a job stage
      description: Update stage name, status, estimated hours, or order index.
      parameters:
        - $ref: "#/components/parameters/StageId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StageUpdate"
      responses:
        "200":
          description: Updated job detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteStage
      tags: [stages]
      summary: Delete a job stage
      parameters:
        - $ref: "#/components/parameters/StageId"
      responses:
        "200":
          description: Updated job detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /stage-library:
    get:
      operationId: listStageLibrary
      tags: [stage-library]
      summary: List available stage templates
      responses:
        "200":
          description: Stage library items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StageLibraryItem"
    post:
      operationId: createStageLibraryItem
      tags: [stage-library]
      summary: Add a stage template to the library
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StageLibraryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StageLibraryItem"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /stage-library/{itemId}:
    delete:
      operationId: deleteStageLibraryItem
      tags: [stage-library]
      summary: Remove a stage template from the library
      parameters:
        - $ref: "#/components/parameters/ItemId"
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /processing-path-options:
    get:
      operationId: listProcessingPathOptions
      tags: [bom]
      summary: List processing path options
      description: >-
        Persistent shared list of processing path options, including any
        distinct values already used on assemblies.
      responses:
        "200":
          description: Processing path options
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProcessingPathOption"
    post:
      operationId: createProcessingPathOption
      tags: [bom]
      summary: Add a processing path option
      description: >-
        Adds a new option (trimmed). If an option with the same name already
        exists (case-insensitive), the existing option is returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcessingPathOptionInput"
      responses:
        "201":
          description: Created (or existing option returned)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessingPathOption"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /employees:
    get:
      operationId: listEmployees
      tags: [employees]
      summary: List employees
      parameters:
        - name: activeOnly
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Employees
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Employee"
    post:
      operationId: createEmployee
      tags: [employees]
      summary: Create an employee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /employees/{employeeId}:
    patch:
      operationId: updateEmployee
      tags: [employees]
      summary: Update an employee
      parameters:
        - $ref: "#/components/parameters/EmployeeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteEmployee
      tags: [employees]
      summary: Delete an employee
      parameters:
        - $ref: "#/components/parameters/EmployeeId"
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /time-entries:
