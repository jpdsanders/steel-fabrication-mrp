      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerAddressInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerAddress"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /customer-addresses/{addressId}:
    patch:
      operationId: updateCustomerAddress
      tags: [customers]
      summary: Update a delivery address
      parameters:
        - $ref: "#/components/parameters/AddressId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerAddressUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerAddress"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteCustomerAddress
      tags: [customers]
      summary: Delete a delivery address
      parameters:
        - $ref: "#/components/parameters/AddressId"
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /purchase-orders:
    get:
      operationId: listPurchaseOrders
      tags: [purchase-orders]
      summary: List purchase orders
      description: List all purchase orders, optionally filtered by status or search term.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [draft, sent, approved, rejected]
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Purchase orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PurchaseOrder"

  /jobs/{jobId}/purchase-orders:
    get:
      operationId: listJobPurchaseOrders
      tags: [purchase-orders]
      summary: List a job's purchase orders
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Purchase orders for the job
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PurchaseOrder"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createPurchaseOrder
      tags: [purchase-orders]
      summary: Create a purchase order for a job
      description: >
        Creates a draft purchase order with the given material lines. The PO
        number is auto-assigned by the server.
      parameters:
        - $ref: "#/components/parameters/JobId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseOrderInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseOrderDetail"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /purchase-orders/{poId}:
    get:
      operationId: getPurchaseOrder
      tags: [purchase-orders]
      summary: Get a purchase order with its lines
      parameters:
        - $ref: "#/components/parameters/PoId"
      responses:
        "200":
          description: Purchase order detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseOrderDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updatePurchaseOrder
      tags: [purchase-orders]
      summary: Replace a purchase order's lines
      description: >
        Replaces the full list of material lines. Only draft or rejected
        purchase orders can be edited.
      parameters:
        - $ref: "#/components/parameters/PoId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseOrderInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseOrderDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Purchase order is not editable in its current status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deletePurchaseOrder
      tags: [purchase-orders]
      summary: Delete a purchase order
      description: Approved purchase orders cannot be deleted.
      parameters:
        - $ref: "#/components/parameters/PoId"
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Cannot delete an approved purchase order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /purchase-orders/{poId}/status:
    post:
      operationId: updatePurchaseOrderStatus
      tags: [purchase-orders]
      summary: Change a purchase order's status
      description: >
        Lifecycle transitions: draft/rejected can be sent; sent can be
        approved or rejected (with an optional review comment). Any other
        transition returns 409.
      parameters:
        - $ref: "#/components/parameters/PoId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseOrderStatusInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseOrderDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Invalid status transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  parameters:
    PoId:
      name: poId
      in: path
      required: true
      schema:
        type: integer
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: integer
    AssemblyId:
      name: assemblyId
      in: path
      required: true
      schema:
        type: integer
    PartId:
      name: partId
      in: path
      required: true
      schema:
        type: integer
    StageId:
      name: stageId
      in: path
      required: true
      schema:
        type: integer
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: integer
    EmployeeId:
      name: employeeId
      in: path
      required: true
      schema:
        type: integer
    EntryId:
      name: entryId
      in: path
      required: true
      schema:
        type: integer
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: integer
    EstimateId:
      name: estimateId
      in: path
      required: true
      schema:
        type: integer
    CustomerId:
      name: customerId
      in: path
      required: true
      schema:
        type: integer
    ContactId:
      name: contactId
      in: path
      required: true
      schema:
        type: integer
    AddressId:
      name: addressId
      in: path
      required: true
      schema:
        type: integer
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

    Job:
      type: object
      required:
        - id
        - jobNumber
        - name
        - customer
        - status
        - createdAt
        - updatedAt
        - currentStageName
        - estimatedHours
        - actualHours
        - percentComplete
        - isPastDue
      properties:
        id:
          type: integer
        jobNumber:
          type: string
        name:
          type: string
        customer:
          type: string
        customerId:
          type: ["integer", "null"]
        customerPo:
          type: ["string", "null"]
        status:
          type: string
          enum: [active, on_hold, complete, closed]
        dueDate:
          type: ["string", "null"]
          description: Calendar date (YYYY-MM-DD)
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        currentStageName:
          type: ["string", "null"]
        estimatedHours:
          type: number
        actualHours:
          type: number
        percentComplete:
          type: number
        isPastDue:
          type: boolean
        estimateId:
          type: ["integer", "null"]
        bidNumber:
          type: ["string", "null"]

    JobDetail:
      type: object
      required:
        - id
        - jobNumber
        - name
        - customer
        - status
        - createdAt
        - updatedAt
        - stages
        - estimatedHours
        - actualHours
        - percentComplete
        - isPastDue
        - assignedEmployees
      properties:
        id:
          type: integer
        jobNumber:
          type: string
        name:
          type: string
        customer:
          type: string
        customerId:
          type: ["integer", "null"]
        customerPo:
          type: ["string", "null"]
        status:
          type: string
          enum: [active, on_hold, complete, closed]
        dueDate:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        currentStageName:
          type: ["string", "null"]
        estimatedHours:
          type: number
        actualHours:
          type: number
        percentComplete:
          type: number
        isPastDue:
          type: boolean
        estimateId:
          type: ["integer", "null"]
        bidNumber:
          type: ["string", "null"]
        stages:
          type: array
          items:
            $ref: "#/components/schemas/Stage"
        assignedEmployees:
          type: array
          items:
            $ref: "#/components/schemas/AssignedEmployee"
        bomAssemblies:
          type: array
          items:
            $ref: "#/components/schemas/BomAssembly"
        assemblyCount:
          type: integer
        assemblyProgressPct:
          type: [number, "null"]
        assemblyStatus:
          type: [string, "null"]

    JobStageInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        estimatedHours:
          type: number

    Estimate:
      type: object
      required:
        - id
        - bidNumber
        - name
        - customer
        - status
        - estimatedHours
        - jobId
        - jobNumber
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
        bidNumber:
          type: string
        name:
          type: string
        customer:
          type: string
        status:
          type: string
          enum: [draft, submitted, won, lost]
        estimatedHours:
          type: number
        amount:
          type: ["number", "null"]
        bidDate:
          type: ["string", "null"]
          description: Calendar date (YYYY-MM-DD)
        dueDate:
          type: ["string", "null"]
          description: Calendar date (YYYY-MM-DD)
        notes:
          type: ["string", "null"]
        jobId:
          type: ["integer", "null"]
          description: Linked job id when the estimate was converted
        jobNumber:
          type: ["string", "null"]
          description: Linked job number when the estimate was converted
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    EstimateInput:
      type: object
      required: [name, customer]
      properties:
        name:
          type: string
          minLength: 1
        customer:
          type: string
          minLength: 1
        status:
          type: string
          enum: [draft, submitted, lost]
        estimatedHours:
          type: number
        amount:
          type: ["number", "null"]
        bidDate:
          type: ["string", "null"]
        dueDate:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]

    EstimateUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        customer:
          type: string
          minLength: 1
        status:
          type: string
          enum: [draft, submitted, lost]
        estimatedHours:
          type: number
        amount:
          type: ["number", "null"]
        bidDate:
          type: ["string", "null"]
        dueDate:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]

    EstimateConvertInput:
      type: object
      properties:
        dueDate:
          type: ["string", "null"]
        stages:
          type: array
          description: Custom routing. If omitted, the default workflow is applied.
          items:
            $ref: "#/components/schemas/JobStageInput"

    JobInput:
      type: object
      required: [name, customerId]
      properties:
        name:
          type: string
          minLength: 1
        customerId:
          type: integer
        status:
          type: string
          enum: [active, on_hold, complete, closed]
        dueDate:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        assignedEmployeeIds:
          type: array
          description: Employee ids to assign to the job.
          items:
            type: integer
        stages:
          type: array
          description: Custom routing. If omitted, the default workflow is applied.
          items:
            $ref: "#/components/schemas/JobStageInput"

    JobUpdate:
      type: object
      properties:
        jobNumber:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        customerId:
          type: integer
        customerPo:
          type: ["string", "null"]
          description: Customer purchase order number. Null clears it.
        status:
          type: string
          enum: [active, on_hold, complete, closed]
        dueDate:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        assignedEmployeeIds:
          type: array
          description: Full replacement list of assigned employee ids.
          items:
            type: integer

    AssignedEmployee:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string

    Stage:
      type: object
      required:
        - id
        - jobId
        - name
        - orderIndex
        - status
        - estimatedHours
        - actualHours
        - createdAt
      properties:
        id:
          type: integer
        jobId:
          type: integer
        name:
          type: string
        orderIndex:
          type: integer
        status:
          type: string
          enum: [not_started, in_progress, complete]
        estimatedHours:
          type: number
        actualHours:
          type: number
        createdAt:
          type: string
          format: date-time

    StageInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        estimatedHours:
          type: number
        orderIndex:
          type: integer

    StageUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        status:
          type: string
          enum: [not_started, in_progress, complete]
        estimatedHours:
          type: number
        orderIndex:
          type: integer

    ReorderStagesBody:
      type: object
      required: [stageIds]
      properties:
        stageIds:
          type: array
          minItems: 1
          items:
            type: integer

